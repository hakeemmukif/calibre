# Task -> model routing, read by src/lib/llm/models.ts. All calls go through
# OpenRouter (see src/lib/llm/client.ts) — model ids below are OpenRouter
# slugs.
#
# Model ids confirmed by operator 2026-07-12: donor config/models.yml runs
# the same model for evaluate/tailor/apply, so every task here routes to
# openai/gpt-oss-120b — no per-task escalation valve (donor parity). Prices
# verified 2026-07-03 in the donor project.

tasks:
  resume-extract:
    model: openai/gpt-oss-120b
    # gpt-oss-120b spends part of the max_tokens budget on reasoning tokens;
    # a full résumé's structured JSON plus that overhead overflows 2000 and
    # truncates mid-output, so the budget is sized for large résumés.
    maxTokens: 8000
    temperature: 0.1
    # Extraction is transcription, not inference: low reasoning effort keeps
    # the reasoning-token overhead to a few hundred tokens (default effort
    # burns 1–3k) so a résumé's JSON no longer overflows maxTokens. Paired
    # with the ~2-page input cap in server/resume/extract-text.ts.
    reasoningEffort: low
    # Constrained decoding: forces the model's output to conform to the JSON
    # schema, eliminating parse/shape failures at generation time.
    strict: true
  resume-extract-vision:
    model: mistralai/mistral-small-3.2-24b-instruct
    maxTokens: 8000
    temperature: 0.1
    reasoningEffort: low
    strict: true
  jd-extract:
    model: openai/gpt-oss-120b
    # Same reasoning-token overhead as resume-extract; long JDs overflow 1500.
    maxTokens: 4000
    temperature: 0.1
  match-score:
    model: openai/gpt-oss-120b
    maxTokens: 2000
    temperature: 0.2
  question-extract:
    model: openai/gpt-oss-120b
    # Same reasoning-token overhead as resume-extract; long forms overflow 1500.
    maxTokens: 4000
    temperature: 0.1
  question-answer:
    model: openai/gpt-oss-120b
    maxTokens: 2000
    temperature: 0.3
  tailor:
    model: openai/gpt-oss-120b
    # 12k, not 4k: the tailor task emits a FULL ResumeStore JSON + diff, and
    # gpt-oss-120b spends part of the max_tokens budget on reasoning tokens —
    # a live run at 4k truncated mid-JSON ("Unparseable JSON in completion",
    # 2026-07-12). ~12k output ≈ $0.0018 at this model's pricing.
    maxTokens: 12000
    temperature: 0.4
    # NO strict:true for tailor — and do NOT add it. The `resume` field now
    # uses the EMIT (nullable-safe) schema, but TailorResultSchema also carries
    # `diff[]`, whose entries have `before?`/`after?` optionals (correct — an
    # "add" has no `before`). Strict mode drops optionals from `required` and
    # 400s the whole call, so tailor stays non-strict; the EMIT resume schema
    # under strict:false + emitToStore already fixes the optional-drop bug.
  url-check-search:
    model: perplexity/sonar
    maxTokens: 4000
    temperature: 0
  ghost-web:
    model: perplexity/sonar
    maxTokens: 2000
    temperature: 0

prices:
  openai/gpt-oss-120b: { promptUsdPerMTok: 0.03, completionUsdPerMTok: 0.15 }
  # perplexity/sonar per-token rate; sonar's per-request search fee is not
  # modeled here (2026-07-12 spec §8 known unknown).
  perplexity/sonar: { promptUsdPerMTok: 1, completionUsdPerMTok: 1 }
  # Placeholder per-MTok rates — confirm exact OpenRouter rates at first live use.
  mistralai/mistral-small-3.2-24b-instruct: { promptUsdPerMTok: 0.05, completionUsdPerMTok: 0.10 }
