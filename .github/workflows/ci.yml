name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run contract:check
      - run: npm run build
  eval-resume:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            resume:
              - 'config/templates/resume-extract*.md'
              - 'src/server/resume/resume-store.ts'
              - 'config/models.yml'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.resume == 'true'
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
        if: steps.filter.outputs.resume == 'true'
      # Operator: add OPENROUTER_API_KEY as a repo/environment secret to
      # activate this job. Without it, this step (and the job) no-ops
      # cleanly instead of failing CI — costs real tokens once activated.
      - name: Live résumé-extraction eval
        if: steps.filter.outputs.resume == 'true' && secrets.OPENROUTER_API_KEY != ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # eval.live.test.ts never touches the DB, but it runs through
          # vitest.smoke.config.ts, whose setupFiles (src/smoke/setup.ts)
          # requires DATABASE_URL to be *set* (not connected-to) — placeholder
          # only, no Postgres service needed for this job.
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
        run: npm run eval:resume
  e2e:
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: caliber_e2e }
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5433/caliber_e2e
      CALIBER_TEST_DOUBLES: '1'
      CALIBER_UPLOADS_DIR: ${{ runner.temp }}/caliber-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report/ }
