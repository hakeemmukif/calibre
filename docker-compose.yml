# Caliber single-VPS deploy: app + caddy. system-architecture.md §6.
# DB is an embedded SQLite file (libsql) on the `dbdata` volume — there is NO
# database service. ⚠️ NOT run/validated in the migration environment (no Docker).
# Operator runs it.
#
# Secrets come from an env_file (`.env.production`, NOT committed — see
# .env.production.example). Never put secrets in `environment:` inline args.
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_POSTHOG_KEY: "${NEXT_PUBLIC_POSTHOG_KEY:-}"
    restart: unless-stopped
    # EXACTLY ONE app process — no `deploy.replicas`, no scaling. The in-memory
    # SSE run-registry + the single url-check worker (src/instrumentation.ts)
    # only work in one process; a second replica silently breaks SSE + the queue.
    # SQLite is single-writer too: a second app would contend on the db file.
    env_file: [.env.production]
    environment:
      # Non-secret runtime config (secrets live in .env.production):
      DATABASE_URL: file:/var/lib/caliber/data/caliber.db
      CALIBER_UPLOADS_DIR: /var/lib/caliber/uploads
      CALIBER_ARCHIVE_DIR: /var/lib/caliber/archive
      SESSION_COOKIE_SECURE: "true"   # served over HTTPS via caddy
      NODE_ENV: production
    volumes:
      - uploads:/var/lib/caliber/uploads   # persist résumé files across deploys
      - archive:/var/lib/caliber/archive   # nightly raw-crawl archive (2026-07-21-raw-crawl-archive-design.md)
      - dbdata:/var/lib/caliber/data       # persist caliber.db (+ -wal/-shm) across deploys
    # No published ports — only caddy talks to the app.
    expose: ["3000"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  dbdata:
  uploads:
  archive:
  caddy_data:
  caddy_config:
